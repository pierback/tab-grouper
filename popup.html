<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Grouper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16"><rect x="2" y="3" width="7" height="6" rx="1.6"/><rect x="11" y="3" width="7" height="6" rx="1.6"/><rect x="2" y="11" width="16" height="6" rx="1.6"/></svg>
          </span>
          <h1>Tab Grouper</h1>
        </div>
        <button id="open-options" class="icon-button" type="button" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M8.6 2h2.8l.4 2.1 1.6.9 2-.8 1.4 2.4-1.6 1.4v1.9l1.6 1.4-1.4 2.4-2-.8-1.6.9-.4 2.2H8.6l-.4-2.2-1.6-.9-2 .8-1.4-2.4L4.8 11V9.1L3.2 7.7l1.4-2.4 2 .8 1.6-.9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </header>

      <section class="provider-card" aria-label="Grouping engine">
        <div class="provider-line">
          <strong id="provider-label">Loading</strong>
          <span id="provider-account" class="badge" hidden></span>
        </div>
        <span id="provider-meta" class="provider-meta"></span>
      </section>

      <dl class="facts">
        <div>
          <dt>This window</dt>
          <dd id="tab-count">-</dd>
        </div>
        <div>
          <dt>Auto tidy</dt>
          <dd id="auto-tidy-status">-</dd>
        </div>
      </dl>

      <div class="popup-actions">
        <button id="tidy-button" class="primary-button" type="button">Tidy tabs</button>
        <div class="secondary-actions">
          <button id="preview-button" class="secondary-button" type="button">Preview plan</button>
          <button id="undo-button" class="secondary-button" type="button" hidden>Undo last tidy</button>
        </div>
      </div>

      <section id="result" class="result" aria-live="polite" aria-atomic="false"></section>
    </main>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
